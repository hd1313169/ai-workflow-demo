<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>組織管理</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
  /* 組織管理頁專屬版面（僅引用 token，不含色值字面值）*/

  /* 頁面標題與內容的間距（原分頁列已移除）*/
  .area-title + * { margin-top: 24px; }

  /* 篩選：純文字輸入框（與 fb-dropdown 等高）*/
  .om-finput {
    height: 40px; padding: 0 12px; width: 100%;
    border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--bg-surface);
    font: inherit; color: var(--color-ink); outline: 0;
  }
  .om-finput:focus { border-color: var(--head-bg-primary); }
  .om-finput::placeholder { color: var(--text-placeholder); }

  .om-actions { display: flex; justify-content: flex-end; gap: var(--pad-sm); margin: 20px 0 12px; }

  /* 組織表 */
  .om-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .om-table col.c-layer  { width: 9%; }
  .om-table col.c-code   { width: 9%; }
  .om-table col.c-name   { width: 13%; }
  .om-table col.c-parent { width: 10%; }
  .om-table col.c-cdate  { width: 10%; }
  .om-table col.c-cby    { width: 10%; }
  .om-table col.c-ddate  { width: 9%; }
  .om-table col.c-dby    { width: 10%; }
  .om-table col.c-state  { width: 6%; }
  .om-table col.c-ops    { width: 14%; }
  .om-table thead th {
    position: sticky; top: 0; z-index: 1;
    background: var(--color-grey-100); color: var(--color-ink);
    font-weight: var(--fw-medium); font-size: var(--fs-sm); line-height: var(--lh-sm);
    text-align: left; padding: var(--pad-md) var(--pad-sm); white-space: nowrap;
    border-bottom: 1px solid var(--line);
  }
  .om-table thead th .hcell { display: inline-flex; align-items: center; gap: 4px; }
  .om-table thead th .hcell__t { display: inline-flex; flex-direction: column; }
  .om-table thead th .hcell__en { font-size: 12px; font-weight: var(--fw-regular); color: var(--color-grey-500); }
  .om-table thead th .sort-ic { color: var(--color-grey-500); cursor: pointer; }
  .om-table thead th .sort-ic:hover { color: var(--head-bg-primary); }
  .om-table tbody td {
    border-top: 1px solid var(--line);
    padding: var(--pad-md) var(--pad-sm);
    font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--cell-text);
    vertical-align: middle; word-break: break-all;
  }
  .om-table tbody tr:hover td { background: var(--bg-hover-subtle); }
  .om-name { color: var(--color-ink); font-weight: var(--fw-medium); }
  .om-muted { color: var(--text-muted); }

  /* 狀態徽章（實心圓角膠囊、白字，對照角色管理 ）*/
  .om-state {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 22px; padding: 2px 12px;
    border-radius: 999px; font-size: 12px; line-height: 18px; font-weight: var(--fw-medium);
    color: var(--badge-status-text);
  }
  .om-state--on  { background: var(--badge-status-active); }
  .om-state--off { background: var(--badge-status-inactive); }

  .om-op-btn { padding: 6px 12px; font-size: var(--fs-sm); white-space: nowrap; }
  .om-op-btn fb-icon { width: 16px; height: 16px; }

  .om-empty { text-align: center; color: var(--text-faint); padding: 40px 12px; }

  /* ---- Modal 內表單 ---- */
  .om-form { display: flex; flex-direction: column; gap: 20px; }
  .om-field { display: flex; flex-direction: column; gap: var(--gap-2xs); }
  .om-field > label { font-family: var(--font-cn); font-size: var(--fs-sm); line-height: var(--lh-sm); font-weight: var(--fw-medium); color: var(--form-label-text); }
  .om-field > label .en { font-weight: var(--fw-regular); color: var(--form-label-note); }
  .om-field > label em { color: var(--accent-danger); font-style: normal; }
  .om-input {
    font: inherit; color: var(--color-ink); background: var(--bg-surface);
    border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: 9px 12px; width: 100%; outline: 0;
  }
  .om-input:focus { border-color: var(--head-bg-primary); }
  .om-input::placeholder { color: var(--text-placeholder); }
  .om-field.is-invalid .om-input { border-color: var(--accent-danger); }
  .om-counter { align-self: flex-end; font-size: 12px; line-height: 18px; color: var(--text-muted); }

  .om-modal-btns { display: inline-flex; gap: var(--pad-sm); }

  @media (max-width: 900px) {
    .filter__grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
  <!-- ============ 1. 頂部導覽 ============ -->
  <fb-topnav active="tools"></fb-topnav>

  <main class="page">
    <!-- ============ 2. 頁面標題 ============ -->
    <fb-area-title zh="組織管理" en="Organization Mgt."></fb-area-title>

<!-- ============ 4. 篩選 ============ -->
    <fb-filter-card>
      <div class="filter__grid cols-3">
        <div class="field">
          <label>組織層級 <span class="en">Org. Layer</span></label>
          <fb-dropdown id="fLayer" type="single"><script type="application/json">{"options":["所有組織層級 (All Layers)","總公司","區部","副區部","分公司","處/部"],"value":"所有組織層級 (All Layers)"}</script></fb-dropdown>
        </div>
        <div class="field">
          <label>組織代號 <span class="en">Org. No.</span></label>
          <input type="text" class="om-finput" id="fCode" placeholder="輸入組織代號">
        </div>
        <div class="field">
          <label>組織名稱 <span class="en">Org. Name</span></label>
          <input type="text" class="om-finput" id="fName" placeholder="輸入組織名稱">
        </div>
        <div class="field">
          <label>狀態 <span class="en">Status</span></label>
          <fb-dropdown id="fStatus" type="single"><script type="application/json">{"options":["所有狀態 (All Status)","啟用","停用"],"value":"所有狀態 (All Status)"}</script></fb-dropdown>
        </div>
        <div class="field">
          <label>父節點 <span class="en">Parent</span></label>
          <input type="text" class="om-finput" id="fParent" placeholder="輸入父節點">
        </div>
      </div>
      <div class="filter__actions">
        <button class="btn-text muted" id="btnReset" type="button"><fb-icon name="fb-reset"></fb-icon> 重設 Reset</button>
        <button class="btn-primary" id="btnSearch" type="button"><fb-icon name="fb-search"></fb-icon> 查詢 Search</button>
      </div>
    </fb-filter-card>

    <!-- ============ 5. 動作列 ============ -->
    <div class="om-actions">
      <button class="btn-primary" id="btnAdd" type="button"><fb-icon name="fb-plus"></fb-icon> 新增組織 Add</button>
      <button class="btn-outline" id="btnExport" type="button"><fb-icon name="fb-export"></fb-icon> 匯出 Export</button>
    </div>

    <!-- ============ 6. 組織表 ============ -->
    <div class="table-clip">
      <div class="table-wrap">
        <table class="om-table" id="orgTable"></table>
      </div>
    </div>
  </main>

  <!-- ============ 7. 組織 Modal（新增／編輯共用）============ -->
  <fb-modal id="orgModal" heading="新增組織" heading-en="Add New Org.">
    <form class="om-form" onsubmit="return false">
      <fb-toggle id="orgActive" variant="card" checked zh="啟用此功能" en="Active Status"
        desc="停用後將暫時無法使用相關功能"></fb-toggle>

      <div class="om-field" id="fldLayer">
        <label>組織層級 Org. Layer <em>*</em></label>
        <fb-dropdown id="orgLayer" type="single"><script type="application/json">{"options":["請選擇組織層級","總公司","區部","副區部","分公司","處/部"],"value":"請選擇組織層級"}</script></fb-dropdown>
      </div>

      <div class="om-field" id="fldCode">
        <label>組織代號 Org. No. <em>*</em></label>
        <input type="text" class="om-input" id="orgCode" maxlength="10" placeholder="請輸入組織代號">
        <span class="om-counter" id="codeCount">0/10</span>
      </div>

      <div class="om-field" id="fldName">
        <label>組織名稱 Org. Name <em>*</em></label>
        <input type="text" class="om-input" id="orgName" maxlength="50" placeholder="請輸入組織名稱">
        <span class="om-counter" id="nameCount">0/50</span>
      </div>

      <fb-transfer id="orgJuris"
        left-title="未管轄組織 Unjurisdictional Org."
        right-title="管轄組織 Jurisdictional Org."></fb-transfer>
    </form>

    <div data-modal-footer style="display:flex;align-items:center;justify-content:flex-end;gap:16px;width:100%">
      <span class="om-modal-btns">
        <button class="btn-neutral-outline" type="button" data-modal-cancel>取消 Cancel</button>
        <button class="btn-primary" type="button" id="orgSave">儲存 Save</button>
      </span>
    </div>
  </fb-modal>

  <fb-toast id="orgToast"></fb-toast>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/components.js"></script>
<script>
(function () {
  'use strict';

  var LAYER_PLACEHOLDER = '請選擇組織層級';

  /* ---------- 組織資料（寫死；）---------- */
  /* 種子順序＝先前預設檢視的呈現順序（同群內創建日期新到舊、停用列在後），
     以便標記 _seq 後由 fbSortRows 穩定重現，無需隱藏 tie-break。 */
  var ORGS = [
    { layer: '副區部', code: '9313',   name: '台北區部',       createdAt: '2026/05/27', createdBy: 'ADMIN', disabledAt: '', disabledBy: '', active: true },
    { layer: '副區部', code: '9274',   name: '金門區部',       createdAt: '2026/05/03', createdBy: 'ADMIN', disabledAt: '', disabledBy: '', active: true },
    { layer: '分公司', code: '9194',   name: '宜蘭分公司',     createdAt: '2026/05/02', createdBy: 'ADMIN', disabledAt: '', disabledBy: '', active: true },
    { layer: '分公司', code: '9428',   name: '嘉義分公司',     createdAt: '2026/04/24', createdBy: '900001 總公司', disabledAt: '', disabledBy: '', active: true },
    { layer: '分公司', code: '9063',   name: '屏東分公司',     createdAt: '2026/04/24', createdBy: '900001 總公司', disabledAt: '', disabledBy: '', active: true },
    { layer: '處/部',  code: '9531',   name: '苗栗處',         createdAt: '2026/04/24', createdBy: '900001 總公司', disabledAt: '', disabledBy: '', active: true },
    { layer: '處/部',  code: '9827',   name: '台南處',         createdAt: '2026/03/04', createdBy: '000114 ADMIN', disabledAt: '', disabledBy: '', active: true },
    { layer: '副區部', code: '9464',   name: '澎湖區部',       createdAt: '2025/09/18', createdBy: '900001 總公司', disabledAt: '', disabledBy: '', active: true },
    { layer: '區部',   code: '9100',   name: '北一區部',       createdAt: '2025/03/11', createdBy: '900001 總公司', disabledAt: '', disabledBy: '', active: true },
    { layer: '區部',   code: '9200',   name: '中區區部',       createdAt: '2025/03/11', createdBy: '900001 總公司', disabledAt: '', disabledBy: '', active: true },
    { layer: '總公司', code: '900001', name: '示範企業總公司', createdAt: '2024/01/02', createdBy: 'ADMIN', disabledAt: '', disabledBy: '', active: true },
    { layer: '處/部',  code: '9898',   name: '新竹部',         createdAt: '2026/03/04', createdBy: '000114 ADMIN', disabledAt: '2026/08/04', disabledBy: '000114 ADMIN', active: false }
  ];
  ORGS.forEach(function (o, i) { o._seq = i; });
  function nextSeq(arr) { return arr.length ? Math.max.apply(null, arr.map(function (x) { return x._seq || 0; })) + 1 : 0; }

  /* 各組織的管轄清單（code 陣列）；未列出者視為空 */
  var JURIS = {
    '900001': ['9100', '9200'],
    '9100': ['9313', '9274'],
    '9200': ['9531', '9827'],
    '9313': ['9194'],
    '9898': []
  };

  /* 反查父節點：哪個組織的管轄清單包含此 code，取其名稱；查無回傳 '' */
  function findParentName(code) {
    var parentCode = Object.keys(JURIS).filter(function (pc) {
      return JURIS[pc].indexOf(code) !== -1;
    })[0];
    if (!parentCode) return '';
    var parent = ORGS.filter(function (o) { return o.code === parentCode; })[0];
    return parent ? parent.name : '';
  }

  /* ---------- DOM ---------- */
  var table = document.getElementById('orgTable');
  var modal = document.getElementById('orgModal');
  var toast = document.getElementById('orgToast');
  var activeToggle = document.getElementById('orgActive');
  var layerDd = document.getElementById('orgLayer');
  var codeInput = document.getElementById('orgCode');
  var nameInput = document.getElementById('orgName');
  var codeCount = document.getElementById('codeCount');
  var nameCount = document.getElementById('nameCount');
  var juris = document.getElementById('orgJuris');
  var saveBtn = document.getElementById('orgSave');
  var fldLayer = document.getElementById('fldLayer');
  var fldCode = document.getElementById('fldCode');
  var fldName = document.getElementById('fldName');

  function ddSet(dd, v) { dd.value = v; if (dd._syncLabel) dd._syncLabel(); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function dash(s) { return s ? esc(s) : '<span class="om-muted">-</span>'; }

  /* ---------- 篩選（僅「查詢」時套用）---------- */
  var applied = { layer: '', code: '', name: '', status: '', parent: '' };

  function passesFilter(o) {
    if (applied.layer && o.layer !== applied.layer) return false;
    if (applied.code && o.code.indexOf(applied.code) === -1) return false;
    if (applied.name && o.name.indexOf(applied.name) === -1) return false;
    if (applied.status === '啟用' && !o.active) return false;
    if (applied.status === '停用' && o.active) return false;
    if (applied.parent && findParentName(o.code).indexOf(applied.parent) === -1) return false;
    return true;
  }

  /* ---------- 排序（預設：無；停用列置底由 fbSortRows 保證）---------- */
  var DEFAULT_SORT = null;
  var sort = DEFAULT_SORT;
  var sortVal = {
    layer: function (o) { return o.layer; },
    code: function (o) { return o.code; },
    name: function (o) { return o.name; },
    parent: function (o) { return findParentName(o.code); },
    createdAt: function (o) { return o.createdAt; },
    state: function (o) { return o.active ? 0 : 1; }
  };

  function sortedRows(rows) {
    return fbSortRows(rows, { sort: sort, sortVal: sortVal });
  }

  /* ---------- 組織表 ---------- */
  var HEADS = [
    { key: 'layer', zh: '組織層級', en: 'Layer', sortable: true },
    { key: 'code', zh: '組織代號', en: 'Code', sortable: true },
    { key: 'name', zh: '組織名稱', en: 'Name', sortable: true },
    { key: 'parent', zh: '父節點', en: 'Parent', sortable: true },
    { key: 'createdAt', zh: '創建日期', en: 'Create Date', sortable: true },
    { key: 'createdBy', zh: '創建者', en: 'Creator', sortable: false },
    { key: 'disabledAt', zh: '停用日期', en: 'Terminate Date', sortable: false },
    { key: 'disabledBy', zh: '停用者', en: 'Terminator', sortable: false },
    { key: 'state', zh: '狀態', en: 'State', sortable: true },
    { key: 'ops', zh: '操作', en: 'Action', sortable: false }
  ];

  function renderTable() {
    var rows = sortedRows(ORGS.filter(passesFilter));

    var html = '<colgroup>' +
      '<col class="c-layer"><col class="c-code"><col class="c-name"><col class="c-parent"><col class="c-cdate">' +
      '<col class="c-cby"><col class="c-ddate"><col class="c-dby"><col class="c-state"><col class="c-ops"></colgroup>';

    html += '<thead><tr>' + HEADS.map(function (h) {
      var s = h.sortable
        ? ' <span class="sort-ic" data-col="' + h.key + '" role="button" title="排序">' +
          FbIcon.sort(sort && sort.col === h.key ? sort.dir : null) + '</span>'
        : '';
      return '<th><span class="hcell"><span class="hcell__t">' + h.zh +
        '<span class="hcell__en">' + h.en + '</span></span>' + s + '</span></th>';
    }).join('') + '</tr></thead>';

    if (!rows.length) {
      html += '<tbody><tr><td colspan="10" class="om-empty">查無符合條件的組織</td></tr></tbody>';
      table.innerHTML = html;
      bindSort();
      return;
    }

    html += '<tbody>' + rows.map(function (o) {
      var idx = ORGS.indexOf(o);
      return '<tr>' +
        '<td>' + esc(o.layer) + '</td>' +
        '<td>' + esc(o.code) + '</td>' +
        '<td><span class="om-name">' + esc(o.name) + '</span></td>' +
        '<td>' + dash(findParentName(o.code)) + '</td>' +
        '<td>' + esc(o.createdAt) + '</td>' +
        '<td>' + esc(o.createdBy) + '</td>' +
        '<td>' + dash(o.disabledAt) + '</td>' +
        '<td>' + dash(o.disabledBy) + '</td>' +
        '<td><span class="om-state om-state--' + (o.active ? 'on' : 'off') + '">' +
          (o.active ? '啟用' : '停用') + '</span></td>' +
        '<td><button class="btn-outline om-op-btn" type="button" data-edit="' + idx + '">' +
          '<fb-icon name="fb-edit"></fb-icon> 編輯 Edit</button></td>' +
        '</tr>';
    }).join('') + '</tbody>';

    table.innerHTML = html;
    bindSort();
    table.querySelectorAll('[data-edit]').forEach(function (b) {
      b.addEventListener('click', function () { openEdit(+b.getAttribute('data-edit')); });
    });
  }

  function bindSort() {
    table.querySelectorAll('.sort-ic[data-col]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        var k = el.getAttribute('data-col');
        if (!sort || sort.col !== k) sort = { col: k, dir: 'asc' };
        else if (sort.dir === 'asc') sort.dir = 'desc';
        else sort = DEFAULT_SORT;   // 第三次點擊回預設（null）
        renderTable();
      });
    });
  }

  /* ---------- 穿梭清單資料：所有組織（排除自己）---------- */
  function jurisItems(selfCode) {
    return ORGS.filter(function (o) { return o.code !== selfCode; })
      .map(function (o) { return { id: o.code, label: o.code + ' ' + o.name }; });
  }

  /* ---------- Modal：新增 / 編輯 ---------- */
  var editingIndex = null;

  function updateCounts() {
    codeCount.textContent = codeInput.value.length + '/10';
    nameCount.textContent = nameInput.value.length + '/50';
  }

  function requiredFilled() {
    return layerDd.value !== LAYER_PLACEHOLDER &&
      codeInput.value.trim() !== '' &&
      nameInput.value.trim() !== '';
  }
  function refreshSave() { saveBtn.disabled = !requiredFilled(); }

  function clearInvalid() {
    [fldLayer, fldCode, fldName].forEach(function (f) { f.classList.remove('is-invalid'); });
  }

  function openAdd() {
    editingIndex = null;
    modal.setHeading('新增組織', 'Add New Org.');
    activeToggle.checked = true;
    ddSet(layerDd, LAYER_PLACEHOLDER);
    codeInput.value = '';
    codeInput.readOnly = false;
    nameInput.value = '';
    juris.setData(jurisItems(null), []);
    updateCounts();
    clearInvalid();
    refreshSave();
    modal.open();
    setTimeout(function () { layerDd.querySelector('.dd__control').focus(); }, 0);
  }

  function openEdit(i) {
    editingIndex = i;
    var o = ORGS[i];
    modal.setHeading('編輯組織', 'Edit Org.');
    activeToggle.checked = o.active;
    ddSet(layerDd, o.layer);
    codeInput.value = o.code;
    codeInput.readOnly = true;
    nameInput.value = o.name;
    juris.setData(jurisItems(o.code), (JURIS[o.code] || []).slice());
    updateCounts();
    clearInvalid();
    refreshSave();
    modal.open();
  }

  function save() {
    if (!requiredFilled()) {
      fldLayer.classList.toggle('is-invalid', layerDd.value === LAYER_PLACEHOLDER);
      fldCode.classList.toggle('is-invalid', codeInput.value.trim() === '');
      fldName.classList.toggle('is-invalid', nameInput.value.trim() === '');
      return;
    }

    var isActive = activeToggle.checked;
    var layer = layerDd.value;
    var code = codeInput.value.trim();
    var name = nameInput.value.trim();

    if (editingIndex === null) {
      ORGS.push({
        layer: layer, code: code, name: name,
        createdAt: todayStr(), createdBy: '我',
        disabledAt: isActive ? '' : todayStr(), disabledBy: isActive ? '' : '我',
        active: isActive, _seq: nextSeq(ORGS)
      });
      JURIS[code] = juris.value.slice();
      finish('組織已新增');
      return;
    }

    var o = ORGS[editingIndex];
    var wasActive = o.active;
    o.layer = layer;
    o.name = name;
    o.active = isActive;
    JURIS[o.code] = juris.value.slice();

    if (wasActive && !isActive) {
      o.disabledAt = todayStr();
      o.disabledBy = '我';
      finish('組織已停用');
    } else if (!wasActive && isActive) {
      o.disabledAt = '';
      o.disabledBy = '';
      finish('組織已啟用');
    } else {
      finish('組織已更新');
    }
  }

  function finish(msg) {
    modal.close();
    renderTable();
    toast.show(msg);
  }

  function todayStr() {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate());
  }

  /* ---------- 事件綁定 ---------- */
  codeInput.addEventListener('input', function () {
    fldCode.classList.remove('is-invalid');
    updateCounts();
    refreshSave();
  });
  nameInput.addEventListener('input', function () {
    fldName.classList.remove('is-invalid');
    updateCounts();
    refreshSave();
  });
  layerDd.addEventListener('change', function () {
    fldLayer.classList.remove('is-invalid');
    refreshSave();
  });
  saveBtn.addEventListener('click', save);
  document.getElementById('btnAdd').addEventListener('click', openAdd);

  /* 匯出：純示意，不改變表格或清單狀態 */
  document.getElementById('btnExport').addEventListener('click', function () {
    toast.show('（原型）匯出功能為示意');
  });

  /* 篩選 */
  document.getElementById('btnSearch').addEventListener('click', function () {
    var lv = document.getElementById('fLayer').value;
    applied.layer = /所有組織層級/.test(lv) ? '' : lv;
    applied.code = document.getElementById('fCode').value.trim();
    applied.name = document.getElementById('fName').value.trim();
    var sv = document.getElementById('fStatus').value;
    applied.status = /所有狀態/.test(sv) ? '' : sv;
    applied.parent = document.getElementById('fParent').value.trim();
    renderTable();
  });
  document.getElementById('btnReset').addEventListener('click', function () {
    document.getElementById('fCode').value = '';
    document.getElementById('fName').value = '';
    document.getElementById('fParent').value = '';
    ['fLayer', 'fStatus'].forEach(function (id) {
      var d = document.getElementById(id);
      if (d && d.reset) d.reset();
    });
    applied = { layer: '', code: '', name: '', status: '', parent: '' };
    sort = DEFAULT_SORT;
    renderTable();
  });

/* ---------- 初始 ---------- */
  renderTable();
})();
</script>
</body>
</html>
